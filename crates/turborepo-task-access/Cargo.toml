[package]
name = "turborepo-task-access"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
description = "Trace-based automatic task configuration for Turborepo"

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
turbopath = { workspace = true }
turborepo-cache = { workspace = true }
turborepo-errors = { workspace = true }
turborepo-gitignore = { workspace = true }
turborepo-log = { workspace = true }
turborepo-repository = { workspace = true }
turborepo-run-cache = { path = "../turborepo-run-cache" }
turborepo-scm = { workspace = true }
turborepo-task-executor = { workspace = true }
turborepo-task-id = { workspace = true }
turborepo-turbo-json = { workspace = true }
turborepo-unescape = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
turborepo-repository = { workspace = true, features = ["test-util"] }
