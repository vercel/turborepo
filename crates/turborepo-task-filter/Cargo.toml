turborepo-scope = { workspace = true }
turborepo-task-id = { workspace = true }
turborepo-types = { workspace = true }
wax = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
turborepo-errors = { workspace = true }
