name: ci
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/toolbox
          key: toolbox
      - run: |
          /usr/bin/env node --version
          mkdir -p ~/.kube
          cp ci/kubeconfig ~/.kube/config
          chmod 600 ~/.kube/config
      - run: npm test
