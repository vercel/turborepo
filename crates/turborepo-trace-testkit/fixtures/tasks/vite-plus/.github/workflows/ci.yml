name: ci
on: [push]
jobs:
  math:
    runs-on: ubuntu-latest
    steps:
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/math exec vp test run --coverage
  everything:
    runs-on: ubuntu-latest
    steps:
      - run: pnpm -r exec vp test run
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: pnpm exec vp check
