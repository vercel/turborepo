[tox]
envlist = py{311,312}, lint
skipsdist = false

[testenv]
deps =
    -rrequirements-test.txt
    -c constraints.txt
    pytest-cov
changedir = tests
setenv =
    DATA_DIR = {toxinidir}/data
    file|.env.test
passenv = HOME, CI
commands_pre =
    python -c "import toxpkg"
commands =
    py311: python {toxinidir}/scripts/check_py311.py
    pytest {posargs:.} --data {env:DATA_DIR}

[testenv:lint]
skip_install = true
deps = ruff
changedir = {toxinidir}
commands = ruff check src {[testenv]changedir}
