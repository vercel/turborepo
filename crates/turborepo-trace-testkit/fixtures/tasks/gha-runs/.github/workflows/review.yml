name: Review
on:
  pull_request:
    paths:
      - 'packages/**'
  workflow_call:

env:
  CI: true

jobs:
  plan:
    name: Split the packages
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: shards
        run: node .github/scripts/shards.mjs >> "$GITHUB_OUTPUT"

  # The unit tests: a reusable workflow called once per slice that `plan` computes.
  test-packages:
    name: Test packages
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJson(needs.plan.outputs.shards) }}
    uses: ./.github/workflows/batch.yml
    with:
      slice: ${{ toJson(matrix.slice) }}
    secrets: inherit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: pnpm --filter @acme/e2e test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: pnpm check-format

  summary:
    if: always()
    needs: [test-packages, e2e, lint]
    runs-on: ubuntu-latest
    steps:
      - run: echo "done"
