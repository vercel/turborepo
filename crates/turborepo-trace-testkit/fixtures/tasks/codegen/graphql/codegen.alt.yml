overwrite: true
schema:
  - http://localhost:4000/graphql:
      headers:
        Authorization: Bearer x
  - extra/*.graphql
documents: src/**/*.tsx
generates:
  src/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.tsx
      baseTypesPath: types.ts
    plugins:
      - typescript-operations
      - typescript-react-apollo
  src/types.ts:
    - typescript
