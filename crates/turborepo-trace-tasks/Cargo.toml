[package]
name = "turborepo-trace-tasks"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
description = "Build tooling for `turbo trace`: package scripts, task runners and code generators recognized (never executed) into task specs"
publish = false

[lib]
bench = false

[dependencies]
memchr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }
turborepo-trace-core = { workspace = true }
turborepo-trace-frameworks = { workspace = true }
turborepo-trace-lang-js = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
# The snapshots cover pytest projects: the adapter is on for the tests.
insta = { workspace = true }
turborepo-trace-frameworks = { workspace = true, features = [
  "go",
  "python",
  "rust",
] }

[lints]
workspace = true
