[package]
name = "turborepo-package-watcher"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
description = "Package-level change detection for Turborepo repositories"

[lints]
workspace = true

[dependencies]
notify = { workspace = true }
radix_trie = { workspace = true }
tokio = { workspace = true, features = ["full", "time"] }
tracing = { workspace = true }
turbopath = { workspace = true }
turborepo-config = { path = "../turborepo-config" }
turborepo-daemon = { workspace = true }
turborepo-filewatch = { path = "../turborepo-filewatch" }
turborepo-microfrontends-config = { workspace = true }
turborepo-repository = { workspace = true }
turborepo-scm = { workspace = true }
turborepo-turbo-json = { workspace = true }

[dev-dependencies]
ignore = "0.4.24"
tempfile = { workspace = true }
