# Derived from the published terminal-control 0.6.0 normalized manifest.
# Dev-only library subset; see VENDORED.md for provenance and local changes.

[package]
edition = "2024"
rust-version = "1.93"
name = "terminal-control"
version = "0.6.0"
publish = false
build = false
include = [
  "/src/**",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_LICENSES.md",
  "/VENDORED.md",
  "/.rustfmt.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Control and test terminal applications through stable visible state"
readme = "README.md"
keywords = ["terminal", "tui", "testing", "automation", "ansi"]
categories = ["command-line-utilities", "development-tools::testing"]
license = "MIT"
repository = "https://github.com/anomalyco/terminal-control"

[lib]
name = "terminal_control"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.crossterm]
version = "0.29"

[dependencies.libghostty-vt]
default-features = false
git = "https://github.com/uzaaft/libghostty-rs"
rev = "3c7766d4e5d6ce93870ad666a14c0b5a0e957360"

[dependencies.portable-pty]
version = "0.9.0"

[dependencies.resvg]
default-features = false
features = ["text", "system-fonts", "memmap-fonts"]
version = "0.47.0"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.serde_json]
version = "1.0"

[target."cfg(unix)".dependencies.libc]
version = "0.2"
