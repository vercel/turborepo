[package]
name = "turborepo-setup"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
publish = false

[lints]
workspace = true

[features]
# Cross-crate fixtures only. Consumers must enable this via dev-dependencies.
test-support = ["turborepo-download/test-support"]

[dependencies]
base64 = "0.22.1"
hex = { workspace = true }
jsonc-parser = "0.23.0"
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
turborepo-archive = { workspace = true }
turborepo-download = { workspace = true }
turborepo-package-manager = { workspace = true }
turborepo-platform = { workspace = true }
turborepo-tool-install = { workspace = true }
turborepo-types = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
flate2 = "1.1.9"
reqwest = { workspace = true }
tar = { version = "0.4.45", default-features = false }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }
turborepo-download = { workspace = true, features = ["test-support"] }
