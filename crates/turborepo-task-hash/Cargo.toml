[package]
name = "turborepo-task-hash"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
description = "Task hashing utilities for Turborepo cache invalidation"

[dependencies]
dashmap = { workspace = true }
either = { workspace = true }
globwalk = { version = "0.1.0", path = "../turborepo-globwalk" }
hex = { workspace = true }
itertools = { workspace = true }
rayon = "1.7.0"
serde = { workspace = true, features = ["derive", "rc"] }
thiserror = { workspace = true }
tracing = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

turbopath = { workspace = true }
turborepo-cache = { workspace = true }
turborepo-engine = { path = "../turborepo-engine" }
turborepo-env = { workspace = true }
turborepo-frameworks = { workspace = true }
turborepo-hash = { workspace = true }
turborepo-repository = { path = "../turborepo-repository" }
turborepo-run-summary = { workspace = true }
turborepo-scm = { workspace = true }
turborepo-task-executor = { path = "../turborepo-task-executor" }
turborepo-task-id = { workspace = true }
turborepo-telemetry = { path = "../turborepo-telemetry" }
turborepo-types = { workspace = true }

tokio = { workspace = true, features = ["time", "rt"] }

[dev-dependencies]
dunce = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
turborepo-repository = { path = "../turborepo-repository", features = [
  "test-util",
] }

[features]
default = []

[lints]
workspace = true
