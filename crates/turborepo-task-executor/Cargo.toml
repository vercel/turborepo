[package]
name = "turborepo-task-executor"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lints]
workspace = true

[dependencies]
# Foundation crates
turbopath = { path = "../turborepo-paths" }
turborepo-errors = { workspace = true }
turborepo-task-id = { path = "../turborepo-task-id" }
turborepo-types = { path = "../turborepo-types" }

# Package graph types for command providers
turborepo-repository = { path = "../turborepo-repository" }

# Cache
turborepo-cache = { path = "../turborepo-cache" }
turborepo-run-cache = { path = "../turborepo-run-cache" }

# UI
turborepo-ui = { path = "../turborepo-ui", features = ["tui"] }

# Command execution
turborepo-env = { workspace = true }
turborepo-process = { workspace = true }

# CI detection for output

# Run summary for TaskTracker
turborepo-run-summary = { path = "../turborepo-run-summary" }

# Telemetry
turborepo-telemetry = { path = "../turborepo-telemetry" }

# Used for output types

# Async runtime
tokio = { workspace = true }

# Async utilities

# Serialization (for config)
serde = { workspace = true }

# Console styling
console = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
turborepo-log = { workspace = true }

# Time
chrono = { workspace = true }

# Binary lookup
which = { workspace = true }

# Case conversion for error codes

[dev-dependencies]
tempfile = { workspace = true }
turborepo-repository = { path = "../turborepo-repository", features = [
  "test-util",
] }
