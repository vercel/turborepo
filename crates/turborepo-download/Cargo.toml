[package]
name = "turborepo-download"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
publish = false
description = "Bounded metadata reads and checksum-verifying artifact downloads"

[lints]
workspace = true

[dependencies]
hex = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }
