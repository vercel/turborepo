[package]
name = "turborepo-setup-catalog"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
publish = false

[lints]
workspace = true

[features]
test-support = ["turborepo-download/test-support"]

[dependencies]
# An internal component of mise; pinned exactly because its API is not stable.
aqua-registry = "=2026.11.1"
flate2 = "1.1.9"
futures = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
turborepo-archive = { workspace = true }
turborepo-download = { workspace = true }
turborepo-setup = { path = "../turborepo-setup" }
turborepo-turbo-json = { workspace = true }
url = { workspace = true }

[dev-dependencies]
lzma-rust2 = { version = "0.25.0", default-features = false, features = [
  "std",
  "xz",
  "encoder",
] }
sha2 = { workspace = true }
tar = { version = "0.4.45", default-features = false }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }
turborepo-download = { workspace = true, features = ["test-support"] }
turborepo-setup = { path = "../turborepo-setup", features = ["test-support"] }
