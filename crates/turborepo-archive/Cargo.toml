[package]
name = "turborepo-archive"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
publish = false
description = "Bounded verified archive extraction into owned private staging"

[lints]
workspace = true

[dependencies]
crc32fast = "1.5.0"
flate2 = "1.1.9"
lzma-rust2 = { version = "0.25.0", default-features = false, features = [
  "std",
  "xz",
  "optimization",
] }
tar = { version = "0.4.45", default-features = false }
tempfile = { workspace = true }
thiserror = { workspace = true }
turborepo-download = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
hex = { workspace = true }
lzma-rust2 = { version = "0.25.0", default-features = false, features = [
  "std",
  "xz",
  "encoder",
] }
sha2 = { workspace = true }
