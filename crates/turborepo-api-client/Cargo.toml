[package]
name = "turborepo-api-client"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
native-tls = ["reqwest/native-tls"]
rustls-tls = [
  "reqwest/rustls-tls-native-roots",
  "reqwest/rustls-tls-webpki-roots",
  "dep:turborepo-tls",
]

[dev-dependencies]
anyhow = { workspace = true }
http = "1.1.0"
httpmock = { workspace = true }
insta = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
turborepo-vercel-api-mock = { workspace = true }

[lints]
workspace = true

[dependencies]
bytes.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
rustc_version_runtime = "0.2.1"
rustls-pemfile = "2.1.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = "0.1.15"
tracing = { workspace = true }
turborepo-ai-agents = { workspace = true }
turborepo-ci = { workspace = true }
turborepo-tls = { workspace = true, optional = true }
turborepo-types = { workspace = true }
turborepo-vercel-api = { workspace = true }
url = { workspace = true }
