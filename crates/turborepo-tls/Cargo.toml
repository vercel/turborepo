[package]
name = "turborepo-tls"
version = "0.1.0"
edition = { workspace = true }
license = "MIT"
publish = false

[lints]
workspace = true

[dev-dependencies]
# Exercise ambiguous automatic selection: bootstrap must explicitly install once.
rustls = { version = "0.23.36", default-features = false, features = [
  "aws_lc_rs",
] }

[dependencies]
rustls = { version = "0.23.36", default-features = false, features = [
  "ring",
  "std",
] }
# Only borrow P-521 signature verification; keep ring cipher suites/key exchange.
rustls-webpki = { version = "0.103.10", default-features = false, features = [
  "aws-lc-rs",
  "std",
] }
