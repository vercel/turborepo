packages:
  - apps/*
  - docs/*
  - packages/*
  - "!packages/turbo"
  - examples
  - "!examples/non-monorepo"
  - lockfile-tests

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - next
  - "@next/*"
  - "@vercel/geistdocs"
  # Eve security and correctness releases must be adoptable immediately.
  - eve

allowBuilds:
  "@google/genai": true
  "@swc/core": true
  "@vercel/speed-insights": true
  "@vscode/vsce-sign": false
  core-js-pure: true
  esbuild: true
  keytar: false
  phase: false
  protobufjs: true
  sharp: true
  unrs-resolver: false

overrides:
  esbuild: 0.28.1
