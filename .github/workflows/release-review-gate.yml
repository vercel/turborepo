name: Release review gate

on:
  pull_request:
    types: [edited, opened, ready_for_review, reopened, synchronize]
  pull_request_review:
    types: [dismissed, submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Release Semantic Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate review requirement
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/validate-review-gate.mjs
