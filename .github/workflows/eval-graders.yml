name: Agent Eval Graders

on:
  pull_request:
    paths:
      - "evals/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/eval-graders.yml"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/eval-graders.yml"

permissions:
  contents: read

jobs:
  graders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: 24
      - run: pnpm eval:check
      - run: pnpm eval --all --dry
