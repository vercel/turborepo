name: Release PR checks
run-name: Release PR checks ${{ inputs.run-id }}

on:
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: number
      expected-head-sha:
        required: true
        type: string
      run-id:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Release Semantic Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate generated release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        run: node scripts/validate-review-gate.mjs

  test-summary:
    name: Test Summary
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Generated release changes validated"

  js-test-summary:
    name: JS Test Summary
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Generated release changes validated"
