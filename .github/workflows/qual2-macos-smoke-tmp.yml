# TEMPORARY: verifies scripts/standalone-posix-smoke.sh on a hosted macOS
# arm64 runner for this draft PR. Removed before review.
name: Temporary macOS standalone smoke

on:
  pull_request:
    paths:
      - ".github/workflows/qual2-macos-smoke-tmp.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15-xlarge
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - run: brew install bash capnp

      - uses: ./.github/actions/setup-node
        with:
          package-install: "false"

      - uses: ./.github/actions/setup-rust
        with:
          shared-cache-key: turborepo-debug-build
          cache: "false"
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - uses: ./.github/actions/setup-zig

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'packages/turbo-repository/rust/**', 'version.txt') }}
          restore-keys: |
            cargo-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.lock') }}-

      - run: cargo build -p turbo

      # Same packaging as the release step; an ad hoc signature stands in for
      # the Developer ID one.
      - name: Smoke
        env:
          TURBO_SMOKE_SIGNING_IDENTIFIER: com.vercel.turbo
        run: |
          set -euo pipefail
          VERSION=$(target/debug/turbo --version)
          staged="$RUNNER_TEMP/bin"
          assets="$RUNNER_TEMP/standalone-smoke"
          archive="turbo-$VERSION-aarch64-apple-darwin.tar.gz"
          mkdir -p "$staged" "$assets"
          cp target/debug/turbo "$staged/turbo"
          codesign -s - -i com.vercel.turbo -f "$staged/turbo"
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "$assets/$archive" -C "$staged" turbo
          (cd "$assets" && shasum -a 256 "$archive" > SHA256SUMS)
          sh scripts/standalone-posix-smoke.sh "$VERSION" "$assets"
