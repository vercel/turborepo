name: Lint
on:
  workflow_call:

env:
  RUSTFLAGS: "-D warnings"
  TURBO_TELEMETRY_MESSAGE_DISABLED: "1"

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      TURBO_CACHE: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'remote:rw' || 'local:rw' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Turborepo Remote Cache
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: "Setup Node"
        uses: ./.github/actions/setup-node

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-cache-key: turborepo-debug-build
          save-cache: true
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Install Zig
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zig"
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
            | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig/zig" version

      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install cargo-deny
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-deny"
          curl -fsSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.2/cargo-deny-0.19.2-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/cargo-deny"
          echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cargo-deny/cargo-deny" --version

      - name: Check quality
        # Manually set TURBO_API to an empty string to override Hetzner env
        run: |
          TURBO_API= pnpm dlx turbo run quality --env-mode=strict
