name: Lint
on:
  workflow_call:

env:
  RUSTFLAGS: "-D warnings"
  TURBO_TELEMETRY_MESSAGE_DISABLED: "1"

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      TURBO_CACHE: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'remote:rw' || 'local:rw' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Turborepo Remote Cache
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: "Setup Node"
        uses: ./.github/actions/setup-node

      - name: Install Zig
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zig"
          curl -fsSL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz \
            | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig/zig" version

      - name: Install capnproto
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install Global Turbo
        uses: ./.github/actions/install-global-turbo

      - name: Install managed tools
        run: |
          turbo setup --tools-only
          turbo exec -- sh -c 'dirname "$(command -v rustc)"' >> "$GITHUB_PATH"

      - name: Add cargo problem matchers
        shell: bash
        run: echo "::add-matcher::.github/actions/setup-rust/matchers.json"

      - name: Setup Rust Cache
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: ${{ format('{0}-turborepo-debug-build', github.head_ref || github.ref_name) }}
          key: ${{ github.head_ref || github.ref_name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust quality
        # Vercel CI runs the JavaScript, TOML, docs, Rust format, and Rust license checks from `quality`.
        # Manually set TURBO_API to an empty string to override Hetzner env
        run: TURBO_API= turbo run turborepo-crates#lint --env-mode=strict
