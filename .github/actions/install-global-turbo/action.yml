name: "Install standalone turbo"
description: "Installs the latest stable standalone turbo binary (or an overridden version)"

inputs:
  turbo-version:
    description: "Optional version or npm dist-tag for release CI (e.g., 2.11.5, beta, canary)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install standalone turbo (macOS and Linux)
      if: runner.os != 'Windows'
      shell: bash
      env:
        TURBO_VERSION_INPUT: ${{ inputs.turbo-version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        VERSION=""
        if [[ -n "$TURBO_VERSION_INPUT" ]]; then
          if [[ ! "$TURBO_VERSION_INPUT" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$ ]]; then
            echo "::error::Invalid turbo version '${TURBO_VERSION_INPUT}'. Use a semver version or safe npm dist-tag."
            exit 1
          fi
          # The standalone installer accepts release versions, not npm dist-tags.
          VERSION=$(npm view "turbo@$TURBO_VERSION_INPUT" version)
        else
          # Resolve the latest release with the workflow token. The installer's
          # unauthenticated lookup is rate limited per IP, which shared runner IPs exhaust.
          VERSION=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vercel/turborepo/releases/latest \
            | sed -nE 's/.*"tag_name"[[:space:]]*:[[:space:]]*"v?([^"]+)".*/\1/p' | head -n 1)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not resolve the latest turbo release from GitHub."
            exit 1
          fi
        fi
        curl -fsSL https://turborepo.dev/install | TURBO_VERSION="$VERSION" sh

    - name: Install standalone turbo (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        TURBO_VERSION_INPUT: ${{ inputs.turbo-version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:TURBO_VERSION_INPUT) {
          if ($env:TURBO_VERSION_INPUT -cnotmatch '^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$') {
            throw "Invalid turbo version '$env:TURBO_VERSION_INPUT'. Use a semver version or safe npm dist-tag."
          }
          # The standalone installer accepts release versions, not npm dist-tags.
          $env:TURBO_VERSION = npm view "turbo@$env:TURBO_VERSION_INPUT" version
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the turbo version.' }
        } else {
          # Resolve the latest release with the workflow token. The installer's
          # unauthenticated lookup is rate limited per IP, which shared runner IPs exhaust.
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/vercel/turborepo/releases/latest' `
            -Headers @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
          if (-not $release.tag_name) { throw 'Could not resolve the latest turbo release from GitHub.' }
          $env:TURBO_VERSION = $release.tag_name -replace '^v', ''
        }
        irm https://turborepo.dev/install.ps1 | iex
