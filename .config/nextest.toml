# Nextest configuration for Turborepo
# See https://nexte.st/book/configuration.html

[[profile.default.overrides]]
# These OTel tests configure an endpoint without a collector. Bound setup and
# turbo runs to one minute, and do not retry a timed-out test on Windows.
filter = 'package(turbo) and binary(experimental_otel_test)'
slow-timeout = { period = "60s", terminate-after = 1 }
retries = 0

[[profile.default.overrides]]
# `turbo trace` is not supported on Windows yet: the command says so and exits.
# The trace crates' tests build there but assume Unix (symbolic links, file
# modes, `/` paths), so on Windows only `turbo trace`'s own gate test runs
# (`crates/turborepo/tests/trace_test.rs`, package `turbo`).
platform = 'cfg(windows)'
default-filter = 'not package(~turborepo-trace)'
